[workspace]
members = [
  "crates/music-core",
  "crates/music-server",
  "crates/music-engine",
  "crates/audio-post",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ilya Timonin"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "stream", "blocking", "multipart", "socks"] }
hyper-util = { version = "0.1.20", features = ["client-proxy", "client-proxy-system"] }
http = "1"
fs2 = "0.4"
futures-util = "0.3"
eventsource-stream = "0.2"
sha2 = "0.11"
sysinfo = "0.39"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "time", "process"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "set-header"] }
include_dir = "0.7"
parakeet-rs = { version = "0.3.8", default-features = false, features = ["load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-24", "cuda", "directml"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac", "flac", "ogg", "vorbis", "aiff", "alac", "all-meta", "opt-simd"] }
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }
uuid = { version = "1.16", features = ["serde", "v7"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
