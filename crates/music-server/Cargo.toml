[package]
name = "music-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "music_server"
path = "src/lib.rs"

[[bin]]
name = "music-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# "today" and dates the agent names, in this computer's time zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The folder picker for "use models I already have", the same crate Dub Studio uses.
rfd = "0.17"
base64.workspace = true
hound = "3.5"
axum.workspace = true
fs2.workspace = true
futures-util.workspace = true
eventsource-stream.workspace = true
include_dir.workspace = true
audio-post = { path = "../audio-post" }
music-core = { path = "../music-core" }
music-engine = { path = "../music-engine" }
flate2.workspace = true
lofty = "0.25.4"
# The pattern a track without a cover of its own wears (DiceBear, CC0 styles), and
# the PNG it is written into the track as.
dicebear-core = "=11.0.0-rc.2"
dicebear-styles = { version = "=11.0.0-rc.3", default-features = false, features = ["waves", "squircles", "blobs", "constellation", "disco", "glass", "identicon", "landscape", "loops", "marbles", "patchwork", "planets", "rings", "shadows", "shape-grid", "shapes", "slice", "stack", "stripes", "triangles", "weave"] }
resvg = { version = "0.48", default-features = false }
reqwest.workspace = true
hyper-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symphonia.workspace = true
sysinfo.workspace = true
# Studio Hub: anonymous statistics and the news feed (telemetry only after the start screen showed its choice).
studio-hub-client = { git = "https://github.com/timoncool/studio-hub-client", rev = "c972d81bbf5129a30cd90f9b6ba98553a594c247" }
ort.workspace = true
realfft = "3.5"
regex = "1"
encoding_rs = "0.8"
tempfile = "3"
parakeet-rs.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tower = { version = "0.5", features = ["util"] }
uuid.workspace = true
zip.workspace = true
