[package]
name = "music-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
music-core = { path = "../music-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
libc = "0.2"
# The engine started without the AppImage's libraries (dub_core::proc::outside_appimage).
dub-core = { git = "https://github.com/timoncool/dub-studio", rev = "d7d3f7600ff23c25ba497a1636002e429b571641" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
