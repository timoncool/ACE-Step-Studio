name: 버그 신고 (한국어)
description: 무언가 고장 났거나 제대로 동작하지 않음
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다! 많은 문제가 [최신 버전](https://github.com/timoncool/ACE-Step-Studio/releases/latest)에서 이미 고쳐졌습니다.
        스튜디오에서 이 양식을 열었다면 아래쪽 칸은 이미 채워져 있습니다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 오류 알림이 있었다면 그 문구를 그대로 복사해 주세요. 스크린샷도 여기에 끌어다 놓을 수 있습니다.
      placeholder: |
        곡이 「디코딩」에서 멈추고 「이 곡을 만드는 중에 엔진이 멈췄습니다…」라고 나옵니다
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 「생성」 열기
        2. 가사 붙여넣기, 3분
        3. 「생성」 누르기
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
  - type: upload
    id: log
    attributes:
      label: 로그 또는 리포트 묶음
      description: "스튜디오에서 **설정 → 로컬 엔진 → 시스템 진단 → 버그 리포트 묶음 만들기**를 누른 뒤 .zip 파일을 여기에 끌어다 놓으세요. 스튜디오가 열리지 않으면 데이터 폴더의 `engine.log`를 끌어다 놓으세요."
    validations:
      required: false
      accept: ".zip,.log,.txt,.png,.jpg,.mp4"
  - type: input
    id: version
    attributes:
      label: ACE-Step Studio 버전
      description: "**설정 → 정보**"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 시스템과 패키지
      options:
        - Windows — installer (.exe)
        - Windows — portable (.zip)
        - macOS — Apple Silicon (.dmg)
        - Linux — AppImage
        - Linux — .deb
        - Other
  - type: input
    id: os
    attributes:
      label: 시스템 버전
      placeholder: "Windows 11 24H2 · macOS 15.4 · Ubuntu 24.04"
  - type: input
    id: gpu
    attributes:
      label: 그래픽 카드
      placeholder: "RTX 3060 12 GB, 드라이버 581.57 · RX 6600 XT 8 GB · Apple M3 16 GB · GPU 없음"
  - type: input
    id: models
    attributes:
      label: 모델 세트
      description: "**설정 → 모델**"
