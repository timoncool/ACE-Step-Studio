name: Question / Вопрос
description: How to do something, or something is unclear · Как что-то сделать или что-то непонятно
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Write in any language — English, Русский, 中文. · Пишите на любом языке.
  - type: textarea
    id: question
    attributes:
      label: Your question / Ваш вопрос
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ACE-Step Studio version / Версия
      description: "**Settings → About** · **Настройки → О программе**"
  - type: input
    id: os
    attributes:
      label: System / Система
      placeholder: "Windows 11 · macOS 15.4 · Ubuntu 24.04"
  - type: input
    id: gpu
    attributes:
      label: Graphics card / Видеокарта
      placeholder: "RTX 4060 8 GB · Apple M3 16 GB · no GPU"
