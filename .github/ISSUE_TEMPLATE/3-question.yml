name: Question / Вопрос
description: How to do something, or something is unclear · Как что-то сделать или что-то непонятно
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Write in any language — English, Русский, 中文. · Пишите на любом языке.
  - type: textarea
    id: question
    attributes:
      label: Your question / Ваш вопрос
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ACE-Step Studio version / Версия
      description: "**Settings → About** · **Настройки → О программе**"
  - type: input
    id: system
    attributes:
      label: System and graphics card / Система и видеокарта
      placeholder: "Windows 11, RTX 4060 8 GB"
