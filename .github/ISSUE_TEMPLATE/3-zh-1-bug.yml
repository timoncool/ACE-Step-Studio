name: 错误报告 (中文)
description: 某个功能坏了或工作不正常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！很多问题在[最新版本](https://github.com/timoncool/ACE-Step-Studio/releases/latest)中已经修复。
        如果是从工作室打开的这个表单，底部的字段已经自动填好。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么？
      description: 如果出现了错误提示，请完整复制它的文字。截图也可以直接拖到这里。
      placeholder: |
        歌曲停在「解码」，提示「引擎在生成这首歌时停止了……」
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「创作」
        2. 粘贴歌词，时长 3 分钟
        3. 点击「创作」
  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
  - type: upload
    id: log
    attributes:
      label: 日志或报告包
      description: "在工作室中：**设置 → 本地引擎 → 系统诊断 → 生成错误报告包**，然后把 .zip 拖到这里。如果工作室打不开，请拖入数据文件夹里的 `engine.log`。"
    validations:
      required: false
      accept: ".zip,.log,.txt,.png,.jpg,.mp4"
  - type: input
    id: version
    attributes:
      label: ACE-Step Studio 版本
      description: "**设置 → 关于**"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 系统和安装包
      options:
        - Windows — installer (.exe)
        - Windows — portable (.zip)
        - macOS — Apple Silicon (.dmg)
        - Linux — AppImage
        - Linux — .deb
        - Other
  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: "Windows 11 24H2 · macOS 15.4 · Ubuntu 24.04"
  - type: input
    id: gpu
    attributes:
      label: 显卡
      placeholder: "RTX 3060 12 GB，驱动 581.57 · RX 6600 XT 8 GB · Apple M3 16 GB · 无独立显卡"
  - type: input
    id: models
    attributes:
      label: 模型套装
      description: "**设置 → 模型**"
